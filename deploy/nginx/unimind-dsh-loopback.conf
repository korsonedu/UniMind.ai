# DSH workers call only this loopback listener; the public HTTPS site is unchanged.
server {
    listen 127.0.0.1:8002;
    server_name localhost;
    access_log off;

    location ^~ /api/ai/dsh/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host unimind-ai.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP 127.0.0.1;
    }

    location / {
        return 404;
    }
}
