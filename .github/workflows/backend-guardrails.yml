name: backend-guardrails

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/backend-guardrails.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/backend-guardrails.yml'

jobs:
  backend-checks:
    runs-on: ubuntu-24.04
    env:
      ACCOUNT_DEV_LOCAL_CACHE: "true"
      CELERY_BROKER_URL: "memory://"
      CELERY_RESULT_BACKEND: "cache+memory://"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit

      - name: Dependency vulnerability scan
        run: pip-audit --strict

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Migration drift check
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Install browser for learning tool smoke checks
        run: python -m playwright install --only-shell chromium

      - name: Enable sandboxed Chromium in the CI runner
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import subprocess
          browsers = list(Path.home().glob('.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell'))
          assert len(browsers) == 1, browsers
          profile = Path('deploy/unimind-learning-chromium.apparmor').read_text()
          original = '/opt/unimind-learning-worker/browsers/chromium_headless_shell-1217/chrome-headless-shell-linux64/chrome-headless-shell'
          subprocess.run(['sudo', 'apparmor_parser', '-r'], input=profile.replace(original, str(browsers[0])), text=True, check=True)
          from playwright.sync_api import sync_playwright
          with sync_playwright() as runtime:
              browser = runtime.chromium.launch(headless=True, chromium_sandbox=True)
              browser.close()
          PYTHON

      - name: Backend regression tests
        working-directory: backend
        run: python -m pytest

      - name: QA smoke check
        working-directory: backend
        env:
          UNIMIND_CONTENT_INSTITUTION_ID: "global"
        run: |
          python manage.py migrate
          bash ../scripts/smoke_qa.sh

  frontend-build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Dependency vulnerability scan
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Frontend build check
        working-directory: frontend
        run: npm run build

      - name: Frontend lint check
        working-directory: frontend
        run: npm run lint

      - name: Admin frontend build check
        working-directory: frontend/admin
        run: npm run build
