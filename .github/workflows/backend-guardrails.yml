name: backend-guardrails

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'deploy/unimind-learning-followups.*'
      - 'deploy/unimind-celery-beat.service'
      - 'requirements.txt'
      - '.github/workflows/backend-guardrails.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'deploy/unimind-learning-followups.*'
      - 'deploy/unimind-celery-beat.service'
      - 'requirements.txt'
      - '.github/workflows/backend-guardrails.yml'

jobs:
  backend-checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ulr_smoke
          POSTGRES_PASSWORD: ulr_smoke
          POSTGRES_DB: unimind
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ulr_smoke -d unimind"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ACCOUNT_DEV_LOCAL_CACHE: "true"
      CELERY_BROKER_URL: "memory://"
      CELERY_RESULT_BACKEND: "cache+memory://"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit

      - name: Dependency vulnerability scan
        run: pip-audit --strict

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Migration drift check
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Install Chinese fonts and Redis for smoke checks
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-cjk redis-server

      - name: Install browser for learning tool smoke checks
        run: python -m playwright install --only-shell chromium

      - name: Enable sandboxed Chromium in the CI runner
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import subprocess
          browsers = list(Path.home().glob('.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell'))
          assert len(browsers) == 1, browsers
          profile = Path('deploy/unimind-learning-chromium.apparmor').read_text()
          original = '/opt/unimind-learning-worker/browsers/chromium_headless_shell-1217/chrome-headless-shell-linux64/chrome-headless-shell'
          subprocess.run(['sudo', 'apparmor_parser', '-r'], input=profile.replace(original, str(browsers[0])), text=True, check=True)
          from playwright.sync_api import sync_playwright
          with sync_playwright() as runtime:
              browser = runtime.chromium.launch(headless=True, chromium_sandbox=True)
              browser.close()
          PYTHON

      - name: Backend regression tests
        working-directory: backend
        run: python -m pytest

      - name: Standalone ULR release smoke
        working-directory: backend
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: unimind
          DB_USER: ulr_smoke
          DB_PASSWORD: ulr_smoke
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
          ULR_QUEUE_SMOKE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -p pytest_django.plugin -x -W error::pytest.PytestWarning
          ai_assistant/tests/test_ulr_process_smoke.py
          ai_assistant/tests/test_ulr_queue_smoke.py

      - name: QA smoke check
        working-directory: backend
        env:
          UNIMIND_CONTENT_INSTITUTION_ID: "global"
        run: |
          python manage.py migrate
          bash ../scripts/smoke_qa.sh

  frontend-build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Dependency vulnerability scan
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Frontend build check
        working-directory: frontend
        run: npm run build

      - name: Frontend lint check
        working-directory: frontend
        run: npm run lint
