name: desktop-windows

on:
  workflow_dispatch:
  push:
    branches: ['codex/unimind-dsh-m0']
    paths: ['frontend/electron/**', 'frontend/package*.json', '.github/workflows/desktop-windows.yml']
  pull_request:
    paths: ['frontend/electron/**', 'frontend/package*.json', '.github/workflows/desktop-windows.yml']

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/electron/package-lock.json
      - name: Install desktop dependencies
        working-directory: frontend/electron
        run: npm ci
      - name: Build unsigned NSIS candidate
        working-directory: frontend/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Record installer hashes
        shell: pwsh
        working-directory: frontend/electron
        run: |
          Get-ChildItem release/*-setup.exe | Get-FileHash -Algorithm SHA256 | Format-List | Out-File windows-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: UniMind-Windows-x64-${{ github.sha }}
          path: |
            frontend/electron/release/*-setup.exe
            frontend/electron/windows-sha256.txt
          if-no-files-found: error
          retention-days: 14

  installer-smoke:
    needs: windows-x64
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: UniMind-Windows-x64-${{ github.sha }}
          path: downloaded-installer
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install inspection tool only (no app development dependencies)
        run: npm install -g agent-browser@0.41.0 --no-audit --no-fund
      - name: Verify clean installation and first launch
        shell: pwsh
        run: ./frontend/electron/scripts/smoke-windows-installer.ps1 -ArtifactDirectory downloaded-installer -EvidenceDirectory installer-evidence
      - name: Preserve installation results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UniMind-Windows-installation-proof-${{ github.sha }}
          path: installer-evidence/
          if-no-files-found: warn
          retention-days: 14
