name: desktop-windows

on:
  workflow_dispatch:
  push:
    branches: ['codex/unimind-dsh-m0']
    paths: ['frontend/electron/**', 'frontend/package*.json', '.github/workflows/desktop-windows.yml']
  pull_request:
    paths: ['frontend/electron/**', 'frontend/package*.json', '.github/workflows/desktop-windows.yml']

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/electron/package-lock.json
      - name: Install desktop dependencies
        working-directory: frontend/electron
        run: npm ci
      - name: Build unsigned NSIS candidate
        working-directory: frontend/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Record installer hashes
        shell: pwsh
        working-directory: frontend/electron
        run: |
          Get-ChildItem release/*-setup.exe | Get-FileHash -Algorithm SHA256 | Format-List | Out-File windows-sha256.txt
      - name: Verify packaged source
        shell: bash
        working-directory: frontend/electron
        run: |
          node <<'JS'
          const fs = require('node:fs'), crypto = require('node:crypto'), cp = require('node:child_process');
          const asar = require('@electron/asar');
          const version = require('./package.json').version;
          const archive = 'release/win-unpacked/resources/app.asar';
          const metadata = JSON.parse(asar.extractFile(archive, 'package.json'));
          if (metadata.version !== version) throw Error('Packaged version mismatch');
          const hashes = {};
          for (const file of ['dist/main.cjs', 'dist/preload.cjs']) {
            const source = fs.readFileSync(file), packaged = asar.extractFile(archive, file);
            if (!source.equals(packaged)) throw Error(`Packaged source mismatch: ${file}`);
            hashes[file] = crypto.createHash('sha256').update(source).digest('hex');
          }
          fs.writeFileSync('windows-build-info.json', JSON.stringify({version, source_commit:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(), platform:'windows-x64', signature:'unsigned', installation_smoke:'not run', packaged_code_matches:true, hashes}, null, 2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: UniMind-Windows-x64-${{ github.sha }}
          path: |
            frontend/electron/release/*-setup.exe
            frontend/electron/windows-sha256.txt
            frontend/electron/windows-build-info.json
          if-no-files-found: error
          retention-days: 14
