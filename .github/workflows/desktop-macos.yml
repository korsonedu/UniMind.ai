name: desktop-macos

on:
  workflow_dispatch:
  pull_request:
    paths: ['frontend/electron/**', 'frontend/package*.json', '.github/workflows/desktop-macos.yml']

permissions:
  contents: read

jobs:
  macos-arm64:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/electron/package-lock.json
      - name: Install desktop dependencies
        working-directory: frontend/electron
        run: npm ci
      - name: Build controlled distribution
        working-directory: frontend/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_FOR_PULL_REQUEST: 'true'
        run: npm run candidate:mac
      - name: Verify packaged source
        working-directory: frontend/electron
        run: |
          node <<'JS'
          const fs = require('node:fs'), crypto = require('node:crypto'), cp = require('node:child_process');
          const asar = require('@electron/asar');
          const version = require('./package.json').version;
          const archive = `release/desktop-${version}/mac-arm64/UniMind.app/Contents/Resources/app.asar`;
          const metadata = JSON.parse(asar.extractFile(archive, 'package.json'));
          if (metadata.version !== version) throw Error('Packaged version mismatch');
          const hashes = {};
          for (const file of ['dist/main.cjs', 'dist/preload.cjs']) {
            const source = fs.readFileSync(file), packaged = asar.extractFile(archive, file);
            if (!source.equals(packaged)) throw Error(`Packaged source mismatch: ${file}`);
            hashes[file] = crypto.createHash('sha256').update(source).digest('hex');
          }
          fs.writeFileSync('mac-build-info.json', JSON.stringify({version, source_commit:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(), platform:'macos-arm64', signature:'ad-hoc', notarized:false, packaged_code_matches:true, hashes}, null, 2));
          JS
          codesign --verify --deep --strict release/desktop-*/mac-arm64/UniMind.app
      - uses: actions/upload-artifact@v4
        with:
          name: UniMind-macOS-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            frontend/electron/release/desktop-*/*.dmg
            frontend/electron/release/desktop-*/*.zip
            frontend/electron/mac-build-info.json
          if-no-files-found: error
          retention-days: 14
