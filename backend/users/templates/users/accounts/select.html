{% extends 'users/accounts/base.html' %}
{% block content %}
<h1>请选择继续使用的账号</h1>
<p class="form-description">请选择本次登录使用的 UniMind 账号。</p>
<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next_path }}">
<button class="primary-button" name="selection" value="account" type="submit">{{ request.user.nickname|default:request.user.username }}</button>
<button class="primary-button" name="selection" value="platform" type="submit">{{ platform.nickname|default:platform.username }}</button>
</form>
{% endblock %}
