[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "school_system.settings"
python_files = ["tests.py", "tests_*.py", "test_*.py", "*_tests.py"]
markers = ["integration: requires external integration services"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
